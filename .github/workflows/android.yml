name: Android ARM64 foundation

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Android toolchain
        run: |
          echo "NDK=${ANDROID_NDK_LATEST_HOME}"
          ${ANDROID_NDK_LATEST_HOME}/ndk-build --version
          cmake --version
          ninja --version

      - name: Configure ARM64
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build rw_data
        run: cmake --build build --target rw_data --parallel 2

      - name: Verify ARM64 library
        run: |
          file build/rw_data/librw_data.so
          readelf -h build/rw_data/librw_data.so | grep -E 'Class|Machine'

      - name: Upload ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: mafia-rw-data-arm64-v8a
          path: build/rw_data/librw_data.so
