name: Мой Нативный Порт Мафии
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Копируем код порта
      uses: actions/checkout@v4

    - name: Включаем Android SDK и NDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Настройка переменных окружения NDK
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV

    - name: Собираем C++ код игры под процессор ARM64 телефона
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk-bundle/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Выгружаем готовый нативный бинарник
      uses: actions/upload-artifact@v4
      with:
        name: Мой_Личный_Порт_Мафии
        path: build/*
