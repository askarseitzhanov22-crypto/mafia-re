plugins { id 'com.android.application' }

android {
    namespace 'kz.mafia.android'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'kz.mafia.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
